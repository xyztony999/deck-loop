name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（NestJS · jest 89 用例）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-node
    steps:
      - uses: actions/checkout@v4
      # pnpm 锁 10（11 的 minimum-release-age 与本仓锁文件不兼容）
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server-node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        # test 脚本已固化 cross-env NODE_OPTIONS=--experimental-vm-modules
        # + --runInBand --watchman=false（pptxgenjs 动态 import 需要）
      - run: npm test

  client:
    name: 客户端（typecheck / build / 行为测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  package:
    name: 后端部署包（BT 服务器 artifact）
    # 三门禁全绿才产包（坏的构建不给部署物）；仅 main push 触发
    needs: [backend, client, tauri]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server-node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: server-node
      - run: npm run build
        working-directory: server-node
      # 构建后裁剪为纯生产依赖：服务器端零安装（免 pnpm/网络/版本漂移）
      - run: pnpm install --prod --frozen-lockfile
        working-directory: server-node
      - name: 组装部署包（dist + node_modules + package.json + lockfile + env 模板）
        run: |
          mkdir -p bundle
          cp -r server-node/dist bundle/dist
          cp -r server-node/node_modules bundle/node_modules
          cp server-node/package.json server-node/pnpm-lock.yaml bundle/
          cp deploy/deck-loop.env.example bundle/
          tar -czf "deck-node-${GITHUB_SHA::7}.tgz" -C bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: deck-loop-backend-deploy
          path: deck-node-*.tgz
          if-no-files-found: error

  tauri:
    name: 桌面壳（cargo check · WebView2 COM）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      # 前端 dist 是 tauri context 宏的编译期输入，cargo check 前先产出
      - run: pnpm install --frozen-lockfile
        working-directory: client
      - run: pnpm build
        working-directory: client
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - run: cargo check
        working-directory: client/src-tauri

  deploy:
    name: 部署（宝塔服务器 · systemd deck-loop.service）
    # 部署包已产出（=三门禁全绿）才部署；仅 main push
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deck-loop-backend-deploy
      - name: 上传部署包到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: deck-node-*.tgz
          target: /tmp/deck-loop-deploy
      - name: 解压 · 安装 · 重启（宝塔守护）· 健康检查 · 失败回滚
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR=/www/wwwroot/deck-loop
            BACKUP_DIR=/www/backup/deck-loop
            APP_USER=www
            export PATH="/usr/local/bin:/usr/bin:$PATH"
            mkdir -p "$BACKUP_DIR"
            STAMP=$(date +%Y%m%d%H%M%S)
            cd "$DEPLOY_DIR"
            # 部署前备份（含 node_modules，回滚即解压即用；保留最近 5 份）
            tar -czf "$BACKUP_DIR/pre-$STAMP.tgz" dist node_modules package.json pnpm-lock.yaml 2>/dev/null || true
            ls -t "$BACKUP_DIR"/pre-*.tgz 2>/dev/null | tail -n +6 | xargs -r rm -f
            # 解包新版本（部署包自带生产 node_modules：服务器零安装）；
            # --no-same-owner 防 runner 数字 uid 映射成服务器 mysql 用户
            tar --no-same-owner -xzf /tmp/deck-loop-deploy/deck-node-*.tgz -C "$DEPLOY_DIR"
            rm -f /tmp/deck-loop-deploy/deck-node-*.tgz
            chown -R $APP_USER:$APP_USER "$DEPLOY_DIR/dist" "$DEPLOY_DIR/node_modules"
            # 重启（systemd 接管：deck-loop.service，User=www，Restart=always）
            systemctl restart deck-loop
            UP=0
            for i in $(seq 1 30); do
              sleep 1
              CODE=$(curl -s -m 3 -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/auth/login -H 'Content-Type: application/json' -d '{"email":"ci@health.check","password":"x"}' || true)
              [ "$CODE" = "200" ] && UP=1 && break
            done
            if [ "$UP" != "1" ]; then
              echo "健康检查失败，回滚最近备份"
              LATEST=$(ls -t "$BACKUP_DIR"/pre-*.tgz 2>/dev/null | head -1)
              if [ -n "$LATEST" ]; then
                tar --no-same-owner -xzf "$LATEST" -C "$DEPLOY_DIR"
                chown -R $APP_USER:$APP_USER "$DEPLOY_DIR/dist" "$DEPLOY_DIR/node_modules"
                systemctl restart deck-loop
                sleep 5
              fi
              systemctl is-active --quiet deck-loop || journalctl -u deck-loop -n 30 --no-pager
              exit 1
            fi
            echo "部署完成，健康检查 200"; systemctl is-active deck-loop
