name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（NestJS · jest 117 用例）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-node
    steps:
      - uses: actions/checkout@v4
      # pnpm 锁 10（11 的 minimum-release-age 与本仓锁文件不兼容）
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server-node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        # test 脚本已固化 cross-env NODE_OPTIONS=--experimental-vm-modules
        # + --runInBand --watchman=false
      - run: npm test

  mcp:
    name: MCP（SQLite 集成 + headless 三格式冒烟）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            server-node/pnpm-lock.yaml
            mcp-server/pnpm-lock.yaml
      # mcp 经 link: 复用 core 产物——先构建 server-node
      - run: cd server-node && pnpm install --frozen-lockfile && pnpm build
      - run: cd mcp-server && pnpm install --frozen-lockfile && pnpm build
      # 导出冒烟用 headless Chromium（launchBrowser 优先系统 Edge，CI 无 Edge 回退 chromium）
      - run: cd mcp-server && node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: cd mcp-server && pnpm test