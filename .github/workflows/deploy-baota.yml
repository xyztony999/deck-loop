name: Deploy to Baota

# 宝塔生产部署（debateTimer 模式 + 本仓内存现实修正）：
# 构建/测试在 runner 完成（服务器 1.6G 内存扛不住 pnpm install+tsc，2026-10-20 实证
# OOM 僵死）→ 产物（dist + 生产 node_modules）scp 到服务器 → deploy.sh 解包 +
# 宝塔 Node 项目启动脚本重启（vhost/scripts/deck_loop.sh，管理权归面板）+ 健康检查。
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.BAOTA_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server-node/pnpm-lock.yaml
      # runner 构建 + 裁剪纯生产依赖 + 打包
      - run: pnpm install --frozen-lockfile
        working-directory: server-node
      - run: npm run build
        working-directory: server-node
      - run: pnpm install --prod --frozen-lockfile
        working-directory: server-node
      - name: 组装部署包（工作区内相对路径，scp-action 的 glob 以仓库为根）
        run: |
          mkdir -p bundle-out
          tar -czf "bundle-out/deck-node-${GITHUB_SHA::7}.tgz" \
            -C server-node dist node_modules package.json
      - name: 上传部署包
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: bundle-out/deck-node-*.tgz
          target: /tmp/deck-loop-deploy
          strip_components: 1
      - name: 部署（拉码 + 解包 + 宝塔脚本重启 + 健康检查）
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            # 自愈兜底①：无 swap 则加 1G（防再现全机僵死）
            if ! swapon --show 2>/dev/null | grep -q .; then
              fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
              grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
              echo "swap 已创建"
            fi
            # 自愈兜底②：mongod 未运行则拉起（宝塔 init.d；OOM 被杀后不自启的教训）
            if ! pgrep -x mongod >/dev/null 2>&1; then
              /etc/init.d/mongodb start || true
              sleep 4
              pgrep -x mongod >/dev/null || (echo "mongod 拉起失败"; exit 1)
            fi
            APP_DIR=/www/wwwroot/deck-loop
            cd "$APP_DIR"
            # 阿里云→GitHub 慢性抖动（Failure when receiving data / GnuTLS -110 实测）：
            # fetch+checkout+pull 整体重试 4 次
            PULL_OK=0
            for i in 1 2 3 4; do
              if git fetch origin && git checkout main && git pull --ff-only origin main; then
                PULL_OK=1 && break
              fi
              echo "git 更新重试 $i/4"; sleep 8
            done
            [ "$PULL_OK" = "1" ] || (echo "git 更新多次失败"; exit 1)
            bash "${APP_DIR}/deploy/baota/deploy.sh"
