[package]
name = "deck-loop"
version = "0.1.0"
description = "Deck-Loop 桌面客户端（Tauri 壳）"
authors = ["deck-loop"]
edition = "2021"

# 库名与 src/main.rs 中引用保持一致
[lib]
name = "deck_loop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 导出渲染（ADR-015）：Windows 复用宿主 WebView2 打印/截图
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
