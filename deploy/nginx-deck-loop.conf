# deck-loop Nginx 配置（ADR-018：网关/SSE 移除，web 纯静态站 + /api 反代）
#
# 两段用法（宝塔）：
#   A. web 管理站静态站（www.<你的域名> 或裸域名）：整段 server{} 见下「web 静态站」；
#   B. 若沿用独立 api.<你的域名> 后端站点：把「/api 反代」段放进该站点 server{} 内。
#   推荐 A 单站同源（web 默认 API 基址 '/api'，无需构建期注入 VITE_API_BASE_URL）。
#
# 后端 deck-loop-core PORT=18080（宝塔 Node 项目/PM2，见 README-node.md）。

# ── A. web 静态站（单站同源，推荐）──────────────────────────────
# 宝塔：网站 → 添加站点（纯静态）→ 根目录 /www/wwwroot/deck-loop-web
#       → 配置文件，用本段替换/合并 server{} 内容。
server {
    listen 80;
    listen 443 ssl http2;
    server_name www.<你的域名>;   # 按实际域名替换；SSL 证书由宝塔签发

    # web 构建产物（cd web && pnpm build → dist/ 上传解包到此目录）
    root /www/wwwroot/deck-loop-web;
    index index.html;

    # SPA history 路由兜底：/deck /assets /deliver /settings 等深链刷新回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（vite 产物文件名含内容哈希）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # /api 反代（与 B 段同一规则；尾部斜杠剥前缀 → Node 直挂 /{domain}/{resource}/{action}）
    location /api/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 素材上传/导出产物回传（multipart ≤50MB，ADR-015）
        client_max_body_size 60m;
    }
}

# ── B. 独立 api 站点反代段（沿用旧拓扑时粘贴进 api.<你的域名> server{}）──
# ADR-018：/api/gw/task/stream SSE 段已随 AI 网关退役删除（版本进度改网站轻轮询，
# 无长连接需求）；若旧配置仍含该嵌套 location，请一并删除。
#
# location /api/ {
#     proxy_pass http://127.0.0.1:18080/;   # 尾部斜杠 = 剥掉 /api 前缀
#     proxy_http_version 1.1;
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     proxy_read_timeout 60s;
#     client_max_body_size 60m;
# }
#
# 跨源部署（web 与 api 不同域名）时：web 构建期注入
#   VITE_API_BASE_URL=https://api.<你的域名>/api（web/.env.production，gitignore）；
# 服务端 app.enableCors() 已放开跨域，无需额外 CORS 配置。
