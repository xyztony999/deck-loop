# deck-loop 后端反代：把本段放进 api.<你的域名> 站点配置的 server{} 内（后端 PORT=18080）
# （宝塔：网站 → api.<你的域名> → 配置文件，粘贴到 server{} 里；或宝塔「反向代理」手工配等价规则）

location /api/ {
    proxy_pass http://127.0.0.1:18080/;   # 尾部斜杠 = 剥掉 /api 前缀（对齐客户端约定）
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # SSE 任务流（长连接）：关缓冲 + 长读超时，否则流式进度会被 Nginx 攒住
    location /api/gw/task/stream {
        proxy_pass http://127.0.0.1:18080/gw/task/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
