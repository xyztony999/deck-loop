apiVersion: 1
profile:
  name: deck-loop
  type: business
  title: Deck-Loop — AI 演示文稿生成与语言迭代客户端
  depends: [node-nestjs-mongo, vue3-engine]
knowledge:
  inject: CLAUDE.md
  sections:
    business-concepts: knowledge/business-concepts/index.md
    design-decisions: knowledge/design-decisions/index.md
    service-pool: knowledge/service-pool/index.md
    architecture-choices: knowledge/architecture-choices/index.md
workspace:
  root: workspace
  index: workspace/INDEX.md
  stages:
    architecture: workspace/00-architecture
    prd: workspace/02-detailed/prd
    api: workspace/02-detailed/api
    interaction: workspace/02-detailed/interaction
    reports: workspace/05-reports
  conventions:
    enum_pool: workspace/01-solution/common-spec/04-business-enum.md
    common_enums: workspace/01-solution/common-spec/03-common-enums.md
    select_pool: workspace/01-solution/common-spec/05-select-service-pool.md
slots:
  table_prefixes:
    core: dl_
  scaffold_overrides:            # v3：node-nestjs-mongo 栈参数（原 java 三参已废）
    service_dir: server-node
    app_name: deck-loop-core
    npm_scope: "@deck-loop"
